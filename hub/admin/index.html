<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SikshaSetu – Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-darkest: #090c15;
      --bg-base: #0c101c;
      --bg-card: #121829;
      --bg-card-hover: #171f33;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --primary-purple: #6d4aff;
      --accent-teal: #00d293;
      --accent-cyan: #00e5ff;
      --accent-blue: #3b82f6;
      --text-white: #ffffff;
      --text-muted: #8c96ab;
      --text-faint: #56617a;
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-darkest);
      color: #e2e8f5;
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Topbar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 24px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(109, 74, 255, 0.2);
      border: 1px solid rgba(109, 74, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-white);
    }

    .header-inst-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #141a2c;
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 20px;
      color: #e2e8f5;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .header-inst-badge svg {
      color: var(--text-muted);
    }

    /* Main Container */
    .admin-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: 230px;
      background: var(--bg-base);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 6px;
      flex-shrink: 0;
    }

    aside button {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    aside button:hover {
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.04);
    }

    aside button.active {
      color: #ffffff;
      background: linear-gradient(135deg, #6038db, #522ec9);
      box-shadow: 0 4px 16px rgba(96, 56, 219, 0.35);
    }

    aside .nav-logout {
      margin-top: auto;
    }

    /* Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px 48px;
      background: radial-gradient(circle at 50% 0%, #151d36 0%, #090c15 65%);
    }

    .main-inner {
      max-width: 1300px;
      margin: 0 auto;
    }

    .dash-heading {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .dash-subheading {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    /* Top 4 Stat Cards */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon-blue {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }

    .stat-icon-green {
      background: rgba(0, 210, 147, 0.15);
      border: 1px solid rgba(0, 210, 147, 0.3);
      color: var(--accent-teal);
    }

    .stat-icon-purple {
      background: rgba(109, 74, 255, 0.15);
      border: 1px solid rgba(109, 74, 255, 0.3);
      color: #a78bfa;
    }

    .stat-icon-cyan {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--accent-cyan);
    }

    .stat-meta {
      flex: 1;
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .stat-pct {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-left: 6px;
    }

    /* Bottom 3 Panels */
    .admin-panels-row {
      display: grid;
      grid-template-columns: 1.15fr 1fr 1.35fr;
      gap: 20px;
    }

    .admin-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .panel-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .ocw-map-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .ocw-logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mit-logo-badge {
      background: #a31f34;
      color: #ffffff;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group select {
      width: 100%;
      background: #181f33;
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    .btn-map-course {
      background: linear-gradient(135deg, #6d4aff, #5a35ea);
      border: none;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(109, 74, 255, 0.4);
      align-self: flex-start;
      margin-top: 6px;
      font-family: inherit;
    }

    /* Course Status Panel */
    .status-panel-card {
      background: #141c30;
      border: 1px solid rgba(0, 210, 147, 0.2);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-top: auto;
      margin-bottom: auto;
    }

    .status-check-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 210, 147, 0.15);
      border: 2px solid var(--accent-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-teal);
      flex-shrink: 0;
    }

    .status-msg-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .status-msg-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .status-view-details {
      color: #60a5fa;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .status-view-details:hover {
      text-decoration: underline;
    }

    /* System Overview Chart Panel */
    .chart-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-cyan { color: var(--accent-cyan); }
    .legend-purple { color: #a78bfa; }

    .chart-svg-wrap {
      width: 100%;
      height: 150px;
      margin-top: auto;
    }

    .chart-days-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-faint);
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 8px;
      padding: 0 4px;
    }

    /* Generic subview table */
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); font-size: 0.85rem; }
    th { color: var(--text-muted); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <span class="brand-title">SikshaSetu – Admin Panel</span>
    </div>

    <div class="header-inst-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"></path>
      </svg>
      <span>IIIT Senapati</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </header>

  <div class="admin-container">
    <aside>
      <button class="nav-item active" data-page="dash">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Dashboard</span>
      </button>

      <button class="nav-item" data-page="map">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span>Course Mapper</span>
      </button>

      <button class="nav-item" data-page="analytics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Analytics</span>
      </button>

      <button class="nav-item" data-page="users">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Manage Users</span>
      </button>

      <button class="nav-item" data-page="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Institution Settings</span>
      </button>

      <button class="nav-item" data-page="logs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span>System Logs</span>
      </button>

      <button class="nav-item nav-logout" onclick="location.href='/'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </aside>

    <main>
      <div class="main-inner" id="admin-view">
        <!-- Rendered by admin.js -->
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
